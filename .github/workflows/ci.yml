name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      # `typecheck` depends on `codegen`, so the artifacts have just been rebuilt.
      # They are committed, so any drift from the schema means someone forgot to run
      # `pnpm codegen` — fail here rather than shipping a stale contract.
      # `add -N` first so a brand-new product's uncommitted artifacts are visible to
      # `git diff`, which otherwise ignores untracked files entirely. Note the
      # trailing `/**` on the directory pathspec — `'**/src/gql'` matches nothing and
      # would silently skip the whole client preset output.
      - name: Check generated GraphQL artifacts are committed
        run: |
          git add -A -N .
          git diff --exit-code -- '**/schema.graphql' '**/src/gql/**'

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: 1

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs vp, Node, and the package manager (pnpm, detected from
      # `packageManager`), and caches the pnpm store. Pin an exact release —
      # the floating v1 tag is unmaintained (per the Vite+ CI guide).
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: 22
          cache: true

      - name: Install
        run: vp install --frozen-lockfile

      # Vite Task results, keyed per run with prefix restore so each run starts
      # from the newest compatible cache. Cached tasks restore their outputs on
      # a hit, so the codegen artifacts below always materialize.
      - name: Restore Vite Task cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Lint
        run: vp lint

      - name: Format check
        run: vp fmt --check

      - name: Typecheck
        run: vp run -r --cache typecheck

      # The typecheck tasks depend on `codegen`, so the artifacts have just been
      # rebuilt (or restored verbatim from the task cache — same bytes either way).
      # They are committed, so any drift from the schema means someone forgot to run
      # `pnpm codegen` — fail here rather than shipping a stale contract.
      # `add -N` first so a brand-new product's uncommitted artifacts are visible to
      # `git diff`, which otherwise ignores untracked files entirely. Note the
      # trailing `/**` on the directory pathspec — `'**/src/gql'` matches nothing and
      # would silently skip the whole client preset output.
      - name: Check generated GraphQL artifacts are committed
        run: |
          git add -A -N .
          git diff --exit-code -- '**/schema.graphql' '**/src/gql/**'

      - name: Test
        run: vp test

      - name: Build
        run: vp run -r build

      - name: Save Vite Task cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
